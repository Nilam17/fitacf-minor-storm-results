<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitACF minor-storm results</title>
  <style>
    :root {
      --ink: #1b2430;
      --muted: #5b6775;
      --line: #d5dbe3;
      --paper: #f6f3ec;
      --card: #fffdf8;
      --accent: #1f4e79;
      --empty: #8b93a0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: var(--paper);
      color: var(--ink);
    }
    header {
      background: var(--accent);
      color: #f4f7fb;
      padding: 1.1rem 1.4rem 1rem;
    }
    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      font-weight: 600;
    }
    header p { margin: 0; font-size: 0.95rem; opacity: 0.88; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 0.85rem;
      align-items: center;
      padding: 0.85rem 1.4rem;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .bar label {
      font-size: 0.92rem;
      color: var(--muted);
    }
    .sources { display: flex; gap: 0.4rem; }
    .source-btn, select, .chip {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }
    .source-btn {
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .source-btn[aria-current="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    select {
      font-size: 1rem;
      padding: 0.35rem 0.55rem;
      border-radius: 4px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      padding: 0.28rem 0.6rem;
      border-radius: 999px;
      font-size: 0.88rem;
    }
    .chip[aria-current="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    main { padding: 1rem 1.4rem 2.5rem; max-width: 1400px; }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.85rem 1rem 1rem;
      margin: 0 0 1rem;
    }
    section h2 {
      margin: 0 0 0.65rem;
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 600;
    }
    figure { margin: 0; }
    figure img, figure video {
      width: 100%;
      height: auto;
      display: block;
      background: #111;
      border-radius: 4px;
    }
    figure a { display: block; }
    .pair { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }
    @media (min-width: 980px) {
      .pair { grid-template-columns: 1fr 1fr; }
    }
    .empty { color: var(--empty); font-style: italic; padding: 1.4rem 0.2rem; }
    .status { color: var(--muted); font-size: 0.92rem; }
  </style>
</head>
<body>
  <header>
    <h1>FitACF minor-storm results</h1>
    <p>Pick FitACF 2.5 or FitACF 3.0 despeck, then a date. Combined figure, AU/AL, and sub-auroral movies.</p>
  </header>
  <div class="bar">
    <label>Source</label>
    <div class="sources" id="sources"></div>
    <label for="date-select">Date</label>
    <select id="date-select"></select>
    <div class="chips" id="chips"></div>
  </div>
  <main id="main">
    <p class="status">Loading catalogs from disk…</p>
  </main>
  <script>
    const KIND = [
      { key: 'combined', title: 'Combined solar wind / Joule heating / AE' },
      { key: 'au_al', title: 'AU and AL' },
    ];

    let sources = [];
    let sourceId = null;
    let currentDate = null;

    const $main = document.getElementById('main');
    const $sources = document.getElementById('sources');
    const $select = document.getElementById('date-select');
    const $chips = document.getElementById('chips');

    function params() {
      const q = new URLSearchParams(location.search);
      const date = (q.get('date') || (location.hash.slice(1) || '')).replace(/-/g, '');
      return { source: q.get('source'), date: date || null };
    }

    function setUrl(source, date) {
      const url = new URL(location.href);
      url.searchParams.set('source', source);
      if (date) url.searchParams.set('date', date);
      else url.searchParams.delete('date');
      history.replaceState(null, '', url);
    }

    function currentSource() {
      return sources.find((s) => s.id === sourceId);
    }

    function mediaBlock(src, kind) {
      if (!src) return '<p class="empty">Not available for this date.</p>';
      if (kind === 'video') {
        return `<figure><video controls preload="metadata" src="${src}"></video></figure>`;
      }
      return `<figure><a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt=""></a></figure>`;
    }

    function renderDate(date) {
      const src = currentSource();
      const item = src && src.dates.find((d) => d.date === date);
      currentDate = date;
      setUrl(sourceId, date);
      $select.value = date || '';
      for (const btn of $chips.querySelectorAll('.chip')) {
        btn.setAttribute('aria-current', btn.dataset.date === date ? 'true' : 'false');
      }
      if (!item) {
        $main.innerHTML = `<p class="empty">No ${src ? src.label : ''} results for ${date || 'this date'}.</p>`;
        return;
      }
      $main.innerHTML = `
        ${KIND.map((k) => `
          <section>
            <h2>${k.title} · ${src.label} · ${item.label}</h2>
            ${mediaBlock(item[k.key], 'image')}
          </section>`).join('')}
        <section>
          <h2>Sub-auroral maps · ${src.label} · ${item.label}</h2>
          <div class="pair">
            <div>
              <h2>MLT–MLAT</h2>
              ${mediaBlock(item.movie, 'video')}
            </div>
            <div>
              <h2>Polar</h2>
              ${mediaBlock(item.polar, 'video')}
            </div>
          </div>
        </section>`;
    }

    function fillDates(preferred) {
      const src = currentSource();
      const dates = src ? src.dates : [];
      $select.innerHTML = dates.map(
        (d) => `<option value="${d.date}">${d.label}</option>`
      ).join('');
      $chips.innerHTML = dates.map(
        (d) => `<button type="button" class="chip" data-date="${d.date}">${d.label}</button>`
      ).join('');
      $select.onchange = () => renderDate($select.value);
      $chips.onclick = (ev) => {
        const btn = ev.target.closest('.chip');
        if (btn) renderDate(btn.dataset.date);
      };
      if (!dates.length) {
        $main.innerHTML = `<p class="empty">No figures or movies for ${src ? src.label : 'this source'}.</p>`;
        setUrl(sourceId, null);
        return;
      }
      const next = dates.some((d) => d.date === preferred) ? preferred : dates[0].date;
      renderDate(next);
    }

    function setSource(id, preferredDate) {
      sourceId = id;
      for (const btn of $sources.querySelectorAll('.source-btn')) {
        btn.setAttribute('aria-current', btn.dataset.source === id ? 'true' : 'false');
      }
      fillDates(preferredDate || currentDate);
    }

    function fillSources(preferredSource, preferredDate) {
      $sources.innerHTML = sources.map(
        (s) => `<button type="button" class="source-btn" data-source="${s.id}">${s.label}</button>`
      ).join('');
      $sources.onclick = (ev) => {
        const btn = ev.target.closest('.source-btn');
        if (btn) setSource(btn.dataset.source, currentDate);
      };
      const first = sources.some((s) => s.id === preferredSource)
        ? preferredSource
        : (sources[0] && sources[0].id);
      if (!first) {
        $main.innerHTML = '<p class="empty">No result catalogs found.</p>';
        return;
      }
      setSource(first, preferredDate);
    }

    fetch('catalog.json', {cache: 'no-store'})
      .then((r) => {
        if (!r.ok) return fetch('/api/catalog', {cache: 'no-store'}).then((r2) => r2.json());
        return r.json();
      })
      .then((payload) => {
        sources = payload.sources || [];
        const want = params();
        fillSources(want.source, want.date);
      })
      .catch((err) => {
        $main.innerHTML = `<p class="empty">Could not load /api/catalog. Start the server with serve.py. ${err}</p>`;
      });
  </script>
</body>
</html>
